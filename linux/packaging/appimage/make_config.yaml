# flutter_distributor — AppImage packaging configuration (REFERENCE ONLY).
#
# CI no longer uses flutter_distributor: its 0.6.10 appimage maker (latest
# upstream) hard-fails on the bundled ffmpeg_kit prebuilts' old sonames and
# even parses `=> not found` into a literal `cp not ...` command. Release
# builds now use tools/package_appimage.sh instead. This file is kept so a
# local `flutter_distributor package --platform=linux --targets=appimage`
# still works, and as the canonical app identity metadata (name, icon,
# categories) for the AppImage — which tools/package_appimage.sh mirrors in
# linux/packaging/appimage/wavely.desktop.
#
# `icon` must point at a file that exists in the repository. The web icons
# are committed, so the 512px PWA icon doubles as the Linux desktop icon.
display_name: Wavely
icon: web/icons/icon-512.png
generic_name: Music Player
categories:
  - Audio
  - AudioVideo
  - Music
keywords:
  - music
  - player
  - audio
startup_notify: true
