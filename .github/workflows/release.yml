# Wavely release workflow (Stage 2.2).
#
# Trigger: pushing a tag `v*.*.*` (e.g. v0.1.0).
#
# Builds release artifacts per platform and creates a GitHub Release.
# NO SIGNING SECRETS ARE USED — MSIX/AppImage packaging is unsigned
# placeholders; the owner signs locally before distributing real builds
# (docs/PACKAGING.md §signing).
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android (arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The repo does not commit platform runner folders (see README
      # "Getting Started"); scaffold them in CI. flutter create . only
      # generates MISSING files — lib/, pubspec.yaml etc. are untouched.
      - run: flutter create . --platforms=android --org app.wavely --project-name wavely
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --target-platform android-arm64
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/wavely-${GITHUB_REF_NAME}-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/

  build-windows:
    name: Windows (release zip + MSIX)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Scaffold the missing Windows runner (see README "Getting Started").
      - run: flutter config --enable-windows-desktop
      - run: flutter create . --platforms=windows --org app.wavely --project-name wavely
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - name: Zip release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath dist/wavely-${env:GITHUB_REF_NAME}-windows-x64.zip
      # MSIX via msix_config.yaml (sign: false). Placeholder step: if the
      # msix tooling version drifts, this fails soft and the zip remains.
      - name: Package MSIX (unsigned)
        continue-on-error: true
        run: |
          flutter pub add --dev msix
          dart run msix:create
        shell: pwsh
      - name: Stage MSIX
        shell: pwsh
        run: |
          if (Test-Path build/windows/x64/runner/Release/*.msix) {
            Copy-Item build/windows/x64/runner/Release/*.msix dist/
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/

  build-linux:
    name: Linux (tarball + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Parity with verify.yml: the desktop engine compiles Linux host code
      # (GTK / media_kit headers) — without these the build fails on
      # pkg-config gtk+-3.0.
      - name: Install Linux dev libs
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libmpv-dev mpv ninja-build clang cmake pkg-config
      # Scaffold the missing Linux runner (see README "Getting Started").
      - run: flutter config --enable-linux-desktop
      - run: flutter create . --platforms=linux --org app.wavely --project-name wavely
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: Tar release bundle
        run: |
          mkdir -p dist
          tar -czf dist/wavely-${GITHUB_REF_NAME}-linux-x64.tar.gz \
            -C build/linux/x64/release .
      # AppImage via flutter_distributor (needs linuxdeploy/appimagetool,
      # which the distributor downloads). Placeholder step: fails soft.
      - name: Package AppImage
        continue-on-error: true
        run: |
          dart pub global activate flutter_distributor 0.6.10
          flutter_distributor package --platform=linux --targets=appimage \
            --skip-tests
      - name: Stage AppImage
        run: |
          if compgen -G "dist/*.AppImage" > /dev/null; then :; else
            find . -maxdepth 3 -name '*.AppImage' -exec cp {} dist/ \; || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: dist/

  release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/
      # Stage 3 audit (SEC-15): publish SHA-256 checksums so the app's update
      # checker / owner can verify artifact integrity before installing.
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Wavely ${GITHUB_REF_NAME}" \
            --notes "Automated release build. Artifacts are UNSIGNED placeholders — verify against SHA256SUMS.txt; see docs/PACKAGING.md." \
            dist/*
