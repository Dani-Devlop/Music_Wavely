# Wavely release workflow (Stage 2.2, extended in Stage 4).
#
# Trigger: pushing a tag `v*.*.*` (e.g. v0.2.0).
#
# Builds release artifacts per platform and creates a GitHub Release.
#
# Stage 4 (multi-architecture release assets):
# - Android: universal (fat) APK + 4 split APKs
#   (armeabi-v7a / arm64-v8a / x86_64) via --split-per-abi. 32-bit x86
#   is NOT buildable — modern Flutter engines ship android-arm,
#   android-arm64 and android-x64 only.
# - Windows: x64 only — ZIP + MSIX.
# - Linux:   x64 only — tar.gz + AppImage + Flatpak.
#
# Signing (Stage 4, DAP feature 2.4 — docs/PACKAGING.md §signing):
# - MSIX_CERTIFICATE (base64 PFX, optional secret + MSIX_CERTIFICATE_PASSWORD)
#   → signed MSIX; when the secret is absent the build outputs an
#   UNSIGNED MSIX and still succeeds.
# - APPIMAGE_SIGNING_KEY (armored GPG private key, optional secret)
#   → detached .sig signature next to the AppImage; when absent the
#   AppImage stays unsigned and the build still succeeds.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android (universal + 3 ABI splits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The repo does not commit platform runner folders (see README
      # "Getting Started"); scaffold them in CI. NOTE: flutter create (even
      # with --no-pub) REPLACES pubspec.lock with the template lockfile, and
      # the pub get below then re-solves every dep to the latest allowed —
      # which pulled sqlite3 3.9.0, whose Android x64 prebuilt download
      # fails its baked-in hash check and breaks the APK build. Restore the
      # committed lockfile so the lock stays authoritative.
      - run: flutter create . --no-pub --platforms=android --org app.wavely --project-name wavely
      - run: git checkout -- pubspec.lock
      # flutter_local_notifications requires core library desugaring, which
      # the flutter create template does not enable — see tools/
      # patch_android_desugaring.py.
      - run: python3 tools/patch_android_desugaring.py
      # Android 10+ scoped storage: write the MediaStore bridge MainActivity
      # + media permissions (see tools/patch_android_media_store.py).
      - run: python3 tools/patch_android_media_store.py
      # Phase 9 system integrations: home-screen widgets, quick-settings
      # tile, audio_service MediaBrowser plumbing (lock screen / Android
      # Auto) — see tools/patch_android_widgets.py.
      - run: python3 tools/patch_android_widgets.py
      # Phase 11: Android 13+ per-app language (localeConfig en/fa).
      - run: python3 tools/patch_android_per_app_language.py
      - run: flutter pub get
      # home_widget pins kotlinOptions.jvmTarget 1.8 in its pub-cache
      # build.gradle while its androidx deps expose JVM-11 inlinees — the
      # compiler's inliner rejects that (warning-mode does not cover it).
      # Runs AFTER pub get: the plugin files only exist in the cache then.
      - run: python3 tools/patch_android_jvm_target.py
      - run: dart run build_runner build --delete-conflicting-outputs
      # Universal (fat) APK. Target set = every ABI modern Flutter engines
      # ship (arm / arm64 / x64) — the CLI rejects `android-x86` (32-bit
      # Intel engine artifacts were dropped upstream).
      - name: Build universal APK
        run: >-
          flutter build apk --release
          --target-platform android-arm,android-arm64,android-x64
      # Split APKs, one per ABI (Stage 4 §1.1).
      - name: Build per-ABI split APKs
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64,android-x64
      - name: Stage artifacts
        # GITHUB_REF_NAME is slash-free on tag refs (v1.0.0) but contains a
        # slash on workflow_dispatch from a branch — sanitize so artifact
        # paths never escape the dist/ dir and dispatch test runs work.
        run: |
          NAME="${GITHUB_REF_NAME//\//_}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/wavely-$NAME-android-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            dist/wavely-$NAME-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            dist/wavely-$NAME-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            dist/wavely-$NAME-android-x86_64.apk
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/

  build-windows:
    name: Windows x64 (zip + MSIX)
    runs-on: windows-latest
    env:
      MSIX_CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
      MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Scaffold the missing Windows runner (see README "Getting Started").
      - run: flutter config --enable-windows-desktop
      # --no-pub + lock restore keeps the committed pubspec.lock
      # authoritative (see the android job for the sqlite3 rationale).
      - run: flutter create . --no-pub --platforms=windows --org app.wavely --project-name wavely
      - run: git checkout -- pubspec.lock
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Stage 4 §1.2: Windows targets x64 only (flutter's Windows runner is
      # x64 by default; there is no 32-bit build step to drop, and none is
      # added).
      - run: flutter build windows --release
      - name: Zip release bundle
        shell: pwsh
        run: |
          $n = $env:GITHUB_REF_NAME -replace '/', '_'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath dist/wavely-$n-windows-x64.zip
      # MSIX via msix_config.yaml. Signed when the MSIX_CERTIFICATE secret
      # (base64-encoded PFX) is present; otherwise unsigned. Fails soft —
      # the zip remains.
      - name: Package MSIX (signed when MSIX_CERTIFICATE is present)
        continue-on-error: true
        shell: pwsh
        run: |
          flutter pub add --dev msix
          if ($env:MSIX_CERTIFICATE) {
            Write-Host "MSIX_CERTIFICATE present — building a SIGNED MSIX."
            $certPath = Join-Path $env:GITHUB_WORKSPACE "signing.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:MSIX_CERTIFICATE))
            dart run msix:create --certificate-path $certPath `
              --certificate-password "$env:MSIX_CERTIFICATE_PASSWORD" `
              --install-certificate false
          } else {
            Write-Host "MSIX_CERTIFICATE not set — building an UNSIGNED MSIX (see docs/PACKAGING.md)."
            dart run msix:create
          }
      - name: Stage MSIX
        shell: pwsh
        run: |
          if (Test-Path build/windows/x64/runner/Release/*.msix) {
            Copy-Item build/windows/x64/runner/Release/*.msix dist/
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/

  build-linux:
    name: Linux x64 (tar.gz + AppImage + Flatpak)
    runs-on: ubuntu-latest
    env:
      APPIMAGE_SIGNING_KEY: ${{ secrets.APPIMAGE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Parity with verify.yml: the desktop engine compiles Linux host code
      # (GTK / media_kit headers) — without these the build fails on
      # pkg-config gtk+-3.0.
      - name: Install Linux dev libs
        # Plugin parity: ffmpeg_kit_flutter_new pkg-checks json-glib-1.0,
        # flutter_secure_storage_linux pkg-checks libsecret-1 (>= 0.18.4),
        # sentry-native links libcurl; libgtk-3-dev/libmpv-dev are the
        # verify.yml parity set for the desktop engine. squashfs-tools
        # provides mksquashfs for the AppImage pack (tools/package_appimage.sh).
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libmpv-dev mpv ninja-build clang cmake pkg-config libjson-glib-dev libsecret-1-dev libcurl4-openssl-dev squashfs-tools
      # Scaffold the missing Linux runner (see README "Getting Started").
      - run: flutter config --enable-linux-desktop
      # --no-pub + lock restore keeps the committed pubspec.lock
      # authoritative (see the android job for the sqlite3 rationale).
      - run: flutter create . --no-pub --platforms=linux --org app.wavely --project-name wavely
      - run: git checkout -- pubspec.lock
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Stage 4 §1.2: Linux targets x64 only.
      - run: flutter build linux --release
      - name: Tar release bundle
        run: |
          NAME="${GITHUB_REF_NAME//\//_}"
          mkdir -p dist
          tar -czf "dist/wavely-$NAME-linux-x64.tar.gz" \
            -C build/linux/x64/release .
      # AppImage via tools/package_appimage.sh (hand-rolled). ENFORCED
      # (no continue-on-error): a red job here means no AppImage asset,
      # which is a release blocker.
      #
      # Why NOT flutter_distributor (post-mortem of the second v1.0.0
      # attempt, run 41785397396 — "MakeError: cp: cannot stat 'not'"):
      # 0.6.10 is the latest upstream release and its appimage maker runs
      # `ldd -d` over every bundled .so, then THROWS when a prebuilt
      # ffmpeg_kit library references a soname modern runners no longer
      # ship (libvpx.so.7, libx265.so.199, libtheora{enc,dec}.so.1,
      # libopencore-amrnb.so.0, libvo-amrwbenc.so.0, libxml2.so.2). Its
      # parser even turns the `=> not found` output into a literal
      # `cp not ...` command. There is no exclude option and no newer
      # version to upgrade to. The script re-implements the pass with
      # tolerance: the missing sonames ship INSIDE the image (pinned
      # Ubuntu 22.04 debs — the family the ffmpeg_kit prebuilts were
      # linked against), the runner-resolved deps of every bundled .so are
      # copied (glibc core and the GTK stack of libflutter_linux_gtk.so
      # stay on the host), and packing uses the official appimagetool with
      # APPIMAGE_EXTRACT_AND_RUN=1 (no FUSE on runners).
      - name: Package AppImage
        run: |
          NAME="${GITHUB_REF_NAME//\//_}"
          bash tools/package_appimage.sh \
            build/linux/x64/release/bundle \
            "dist/wavely-$NAME-linux-x64.AppImage"
          test -f "dist/wavely-$NAME-linux-x64.AppImage" || {
            echo '::error::packaging completed but produced no .AppImage'
            exit 1
          }
      # Stage 4 §2.4: detached GPG signature when APPIMAGE_SIGNING_KEY is
      # present; otherwise the AppImage stays unsigned. Fails soft.
      - name: Sign AppImage (when APPIMAGE_SIGNING_KEY is present)
        continue-on-error: true
        run: |
          mkdir -p dist
          if [ -z "$APPIMAGE_SIGNING_KEY" ]; then
            echo "APPIMAGE_SIGNING_KEY not set — AppImage stays UNSIGNED (see docs/PACKAGING.md)."
            exit 0
          fi
          echo "$APPIMAGE_SIGNING_KEY" | gpg --batch --import
          APPIMAGE=$(find . -maxdepth 3 -name '*.AppImage' -type f | head -n 1)
          if [ -n "$APPIMAGE" ]; then
            gpg --batch --yes --detach-sign --output "${APPIMAGE}.sig" "$APPIMAGE"
            # The packaging step stages the AppImage in dist/ directly —
            # only copy when the artifact still lives elsewhere.
            case "$APPIMAGE" in
              dist/*) [ -f "${APPIMAGE}.sig" ] && cp "${APPIMAGE}.sig" dist/ ;;
              *) cp "$APPIMAGE" dist/ && cp "${APPIMAGE}.sig" dist/ ;;
            esac
          else
            echo "No AppImage produced — skipping signature."
          fi
      # Stage 4 §1.2: Flatpak bundle from the pre-built Linux binaries
      # (flatpak/app.wavely.music.yml installs the CI bundle into the
      # freedesktop 23.08 runtime). Fails soft — the tar.gz/AppImage remain.
      - name: Package Flatpak
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08
          flatpak-builder --force-clean --user --repo=flatpak-repo flatpak-build flatpak/app.wavely.music.yml
          flatpak build-bundle flatpak-repo \
            "dist/wavely-${GITHUB_REF_NAME//\//_}-linux-x64.flatpak" app.wavely.music
      - name: Stage Linux artifacts
        run: |
          mkdir -p dist
          # Pick up whatever the optional steps produced (AppImage, .sig,
          # .flatpak) in addition to the tar.gz staged above.
          find . -maxdepth 3 \( -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.flatpak' \) \
            -not -path './flatpak-repo/*' -not -path './flatpak-build/*' \
            -not -path './.appimage-tools/*' \
            -exec cp {} dist/ \; || true
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: dist/

  release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/
      # Stage 7: WinSparkle appcast for the in-app Windows updater. The
      # app degrades to an in-app MSIX download when the feed is absent,
      # so a failure here must never block the release (best-effort).
      - name: Generate Sparkle appcast (best-effort)
        run: |
          python3 tools/generate_appcast.py dist "${GITHUB_REF_NAME}" || \
            echo "::warning::appcast.xml generation failed — Windows in-app updater falls back to the MSIX download"
      # SHA256SUMS.txt is deliberately NOT generated (owner decision):
      # the file must never appear among the release assets.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Wavely ${GITHUB_REF_NAME}" \
            --notes "Automated multi-arch release build (4 Android APKs: universal + armeabi-v7a/arm64-v8a/x86_64 splits — modern Flutter engines no longer ship 32-bit x86; Windows x64; Linux x64 with tar.gz, AppImage and Flatpak). MSIX/AppImage are UNSIGNED unless the owner configured signing secrets — see docs/PACKAGING.md." \
            dist/*
