name: Wavely CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-coverage:
    name: Analyze + Test + Coverage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dev libs (GTK for flutter test of desktop code)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libmpv-dev mpv ninja-build clang cmake pkg-config

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      # Generated files (drift/freezed/retrofit/riverpod/json) are committed
      # via build_runner before analyze so CI never lints stale code.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify no uncommitted generated diffs
        run: git diff --exit-code

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test + coverage
        run: flutter test --coverage

      - name: Coverage threshold (>=70% overall, informational until enforced)
        continue-on-error: true
        run: |
          sudo apt-get install -y lcov
          lcov --summary coverage/lcov.info
          LINES=$(lcov --summary coverage/lcov.info 2>/dev/null | grep -oP 'lines\.{3}: \K[0-9.]+')
          echo "Overall line coverage: $LINES%"
          awk -v l="$LINES" 'BEGIN { exit (l >= 70.0) ? 0 : 1 }' \
            || (echo "::warning::Coverage below 70% target" && exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  build-android:
    name: Android debug APK (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: wavely-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-linux:
    name: Linux debug build (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libmpv-dev mpv ninja-build clang cmake pkg-config
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --debug
