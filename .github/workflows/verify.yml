name: Full Verification

on:
  push:
    branches: [ "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Carried over from the legacy ci.yml: desktop-targeted tests compile
      # Linux host code (GTK / media_kit headers) during `flutter test`.
      - name: Install Linux dev libs
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libmpv-dev mpv ninja-build clang cmake pkg-config

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      # FAIL-FAST (owner mandate: "0 errors, all tests pass" must be
      # observable as a green run). Previously both steps ended with
      # `|| true`, which meant a red issue could never turn the run red —
      # the logs were uploaded but the workflow was green no matter what.
      # Gate policy: ERRORS and WARNINGS fail the run (--no-fatal-infos
      # keeps the ~2.4k pre-existing style infos visible but non-blocking);
      # logs are uploaded on failure for debugging.
      - name: Analyze
        run: flutter analyze --no-fatal-infos > analyze.log 2>&1 || { tail -50 analyze.log; exit 1; }

      - name: Test
        run: flutter test --coverage > test.log 2>&1 || { tail -100 test.log; exit 1; }

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.log
            test.log
