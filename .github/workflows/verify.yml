name: Full Verification

on:
  push:
    branches: [ "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Carried over from the legacy ci.yml: desktop-targeted tests compile
      # Linux host code (GTK / media_kit headers) during `flutter test`.
      - name: Install Linux dev libs
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libmpv-dev mpv ninja-build clang cmake pkg-config

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze > analyze.log 2>&1 || true

      - name: Test
        run: flutter test --coverage > test.log 2>&1 || true

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.log
            test.log
